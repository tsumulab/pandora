# Archive every published GitHub release as a new version of PANDORA's Zenodo
# record (concept DOI 10.5281/zenodo.23908116), so that the concept DOI printed
# in the paper resolves to the latest release.
#
# The new version inherits the previous one's metadata on Zenodo (authors,
# ORCIDs, funding, license, description); edit those on Zenodo. The workflow
# sends only the version, the date, the release link and the archive, and
# leaves the version as a draft to be reviewed and published on Zenodo. Set the
# repository variable ZENODO_AUTOPUBLISH to "true" to publish automatically.
#
# Requires the repository secret ZENODO_TOKEN: a Zenodo personal access token of
# the record's owner, with the deposit:write and deposit:actions scopes.
# Do NOT also enable Zenodo's own GitHub integration for this repository.
name: Zenodo release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  zenodo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the release archive
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="pandora-${TAG#v}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "${TAG}"
          echo "archive=${name}.tar.gz" >> "$GITHUB_ENV"
          echo "version=${TAG#v}" >> "$GITHUB_ENV"

      - name: New version on Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PUBLISH: ${{ vars.ZENODO_AUTOPUBLISH == 'true' && '--publish' || '' }}
        run: |
          python3 .github/scripts/zenodo_release.py "$archive" \
            --version "$version" --release-url "$RELEASE_URL" $PUBLISH
